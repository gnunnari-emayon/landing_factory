<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agencia Standalone — Engine B2B & Focus Group AI</title>

    <!-- React & Tailwind CDN -->
    <script src="https://unpkg.com/react@17/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
                    colors: {
                        brand: {
                            50: '#eef2ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca',
                            dark: '#0b0f19', card: '#111827', border: '#1f2937'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0b0f19; color: #f3f4f6; }
        .glass-panel { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .glass-nav { background: rgba(11, 15, 25, 0.85); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
    </style>
</head>
<body>

    <script>
        window.__INITIAL_PROSPECTS__ = {{ initial_prospects | default([]) | tojson }};
    </script>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const App = () => {
            const [activeTab, setActiveTab] = useState('prospector');
            const [searchMotor, setSearchMotor] = useState('places');
            const initialData = Array.isArray(window.__INITIAL_PROSPECTS__) ? window.__INITIAL_PROSPECTS__ : [];
            const [prospects, setProspects] = useState(initialData);
            const [loading, setLoading] = useState(false);
            const [searchQuery, setSearchQuery] = useState('');
            const [searchCity, setSearchCity] = useState('');

            // Autocompletado e Inferencia Inteligente LATAM (con Debounce optimizado a 50ms y Caché en cliente)
            const [sugerenciasRubro, setSugerenciasRubro] = useState([]);
            const [sugerenciasUbicacion, setSugerenciasUbicacion] = useState([]);
            const cacheRubrosRef = React.useRef({});
            const cacheUbicacionesRef = React.useRef({});
            const debounceRubroTimerRef = React.useRef(null);
            const debounceUbicacionTimerRef = React.useRef(null);

            const fetchRubrosSugerencias = (q) => {
                if (debounceRubroTimerRef.current) clearTimeout(debounceRubroTimerRef.current);
                const queryStr = (q || '').trim();
                
                if (cacheRubrosRef.current[queryStr]) {
                    setSugerenciasRubro(cacheRubrosRef.current[queryStr]);
                    return;
                }

                debounceRubroTimerRef.current = setTimeout(async () => {
                    try {
                        const res = await fetch(`/api/v1/agencia/rubros/sugerir?q=${encodeURIComponent(queryStr)}`);
                        if (res.ok) {
                            const data = await res.json();
                            const items = data.items || [];
                            cacheRubrosRef.current[queryStr] = items;
                            setSugerenciasRubro(items);
                        }
                    } catch (e) {}
                }, 50);
            };

            const fetchUbicacionesSugerencias = (q) => {
                if (debounceUbicacionTimerRef.current) clearTimeout(debounceUbicacionTimerRef.current);
                const queryStr = (q || '').trim();

                if (cacheUbicacionesRef.current[queryStr]) {
                    setSugerenciasUbicacion(cacheUbicacionesRef.current[queryStr]);
                    return;
                }

                debounceUbicacionTimerRef.current = setTimeout(async () => {
                    try {
                        const res = await fetch(`/api/v1/agencia/ubicaciones/sugerir?q=${encodeURIComponent(queryStr)}`);
                        if (res.ok) {
                            const data = await res.json();
                            const items = data.items || [];
                            cacheUbicacionesRef.current[queryStr] = items;
                            setSugerenciasUbicacion(items);
                        }
                    } catch (e) {}
                }, 50);
            };

            // Buscador en la tabla
            const [tableFilter, setTableFilter] = useState('');

            // Estado del Modal de Configuración Comercial
            const [demoPromptModal, setDemoPromptModal] = useState({ open: false, prospect: null });
            const [customPromptText, setCustomPromptText] = useState('');
            const [precioCliente, setPrecioCliente] = useState(350);
            const [dominioInput, setDominioInput] = useState('');
            const [dominiosList, setDominiosList] = useState([]);
            const [checkingDomain, setCheckingDomain] = useState(false);

            // Modal Resultados
            const [demoResultModal, setDemoResultModal] = useState({ open: false, data: null, loading: false });
            const [dlocalLink, setDlocalLink] = useState('');
            const [generatingCheckout, setGeneratingCheckout] = useState(false);

            // Focus Group State
            const [chatMessages, setChatMessages] = useState([
                { sender: 'ai', text: '¡Hola! Soy tu asistente de Focus Group con IA. ¿En qué nicho o campaña deseas obtener feedback del público objetivo?' }
            ]);
            const [chatInput, setChatInput] = useState('');

            // Stats iniciales desde los datos precargados
            const [stats, setStats] = useState(() => {
                const sin_web = initialData.filter(p => !p.sitio_web).length;
                const enriquecidos = initialData.filter(p => p.status === 'ENRIQUECIDO' || p.whatsapp || p.email).length;
                const contactados = initialData.filter(p => p.status && p.status.includes('CONTACTADO')).length;
                return { total: initialData.length, sin_web, enriquecidos, contactados };
            });

            // Cargar prospectos locales inmediatamente al instanciar
            useEffect(() => {
                fetchProspects();
            }, []);

            const fetchProspects = async () => {
                try {
                    const res = await fetch('/api/v1/agencia/prospectos_b2b/?limit=20000');
                    if (res.ok) {
                        const data = await res.json();
                        const list = Array.isArray(data) ? data : (data.items || []);
                        setProspects(list);

                        const totalReal = (data && typeof data.total === 'number') ? data.total : list.length;
                        const sin_web = list.filter(p => !p.sitio_web).length;
                        const enriquecidos = list.filter(p => p.status === 'ENRIQUECIDO' || p.whatsapp || p.email).length;
                        const contactados = list.filter(p => p.status && p.status.includes('CONTACTADO')).length;
                        setStats({ total: totalReal, sin_web, enriquecidos, contactados });
                    }
                } catch (e) {
                    console.log('Error cargando prospectos:', e);
                }
            };

            const handleProspectar = async (e) => {
                e.preventDefault();
                if (!searchQuery || !searchCity) {
                    alert('Ingresa el rubro y la ciudad para iniciar la búsqueda.');
                    return;
                }
                setLoading(true);
                try {
                    const endpoint = searchMotor === 'reach' 
                        ? '/api/v1/agencia/b2b/prospectar-agent-reach' 
                        : '/api/v1/agencia/b2b/prospectar';
                    
                    const payload = searchMotor === 'reach'
                        ? { rubro: searchQuery, ubicacion: searchCity }
                        : { tipo_busqueda: searchQuery, ciudad_nombre: searchCity };

                    const res = await fetch(endpoint, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (res.ok) {
                        await fetchProspects();
                    } else {
                        console.error('Error al iniciar prospección');
                    }
                } catch (err) {
                    console.error('Error conectando con la API local:', err);
                } finally {
                    setLoading(false);
                }
            };

            const openDemoConfigModal = async (prospect) => {
                setDemoPromptModal({ open: true, prospect: prospect });
                setCustomPromptText('');
                setPrecioCliente(350);
                setDlocalLink('');

                // Buscar disponibilidad de dominio sugerido
                setCheckingDomain(true);
                try {
                    const res = await fetch('/api/v1/agencia/dominio/verificar?nombre=' + encodeURIComponent(prospect.nombre));
                    if (res.ok) {
                        const domData = await res.json();
                        setDominioInput(domData.sugerencia_principal || '');
                        setDominiosList(domData.dominios || []);
                    }
                } catch (e) {
                    console.log('Error verificando dominio:', e);
                } finally {
                    setCheckingDomain(false);
                }
            };

            const triggerGenerarDemo = async (customPrompt = '') => {
                const prospect = demoPromptModal.prospect;
                const pCliente = precioCliente;
                const domElegido = dominioInput;

                if (!prospect || !prospect.place_id) {
                    alert('Error: No se encontró la información del prospecto.');
                    return;
                }

                const targetPlaceId = prospect.place_id;
                setDemoPromptModal({ open: false, prospect: null });
                setDemoResultModal({ open: true, data: null, loading: true });

                try {
                    const res = await fetch('/api/v1/agencia/prospectos_b2b/generar-demo/' + encodeURIComponent(targetPlaceId), {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            custom_prompt: customPrompt,
                            precio_usd: pCliente,
                            dominio_elegido: domElegido
                        })
                    });
                    if (res.ok) {
                        const demoData = await res.json();
                        setDemoResultModal({ open: true, data: demoData, loading: false });

                        // Generar Checkout dLocal GO automático
                        generarCheckoutDLocal(targetPlaceId, pCliente, domElegido);
                    } else {
                        const errText = await res.text();
                        alert('No se pudo generar la demo para este prospecto. (' + res.status + ')');
                        setDemoResultModal({ open: false, data: null, loading: false });
                    }
                } catch (err) {
                    alert('Error invocando el generador de demos: ' + err.message);
                    setDemoResultModal({ open: false, data: null, loading: false });
                }
            };

            const generarCheckoutDLocal = async (placeId, pCliente, domElegido) => {
                setGeneratingCheckout(true);
                try {
                    const res = await fetch('/api/v1/agencia/checkout/crear-link-custom', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            place_id: placeId,
                            precio_usd: pCliente,
                            dominio_elegido: domElegido
                        })
                    });
                    if (res.ok) {
                        const ckData = await res.json();
                        if (ckData.checkout_url) {
                            setDlocalLink(ckData.checkout_url);
                        }
                    }
                } catch (e) {
                    console.log('Error creando checkout:', e);
                } finally {
                    setGeneratingCheckout(false);
                }
            };

            const handleSendFocusGroup = (e) => {
                e.preventDefault();
                if (!chatInput.trim()) return;
                const userMsg = chatInput;
                setChatMessages(prev => [...prev, { sender: 'user', text: userMsg }]);
                setChatInput('');

                setTimeout(() => {
                    setChatMessages(prev => [...prev, { 
                        sender: 'ai', 
                        text: '[Focus Group AI - Insights sobre "' + userMsg + '"]: La audiencia objetivo percibe esta propuesta de forma favorable. Se sugiere reforzar la garantía de devolución y el soporte prioritario.' 
                    }]);
                }, 800);
            };

            // Filtrar prospectos por el buscador en vivo
            const filteredProspects = prospects.filter(p => {
                if (!tableFilter) return true;
                const filter = tableFilter.toLowerCase();
                return (
                    (p.nombre && p.nombre.toLowerCase().includes(filter)) ||
                    (p.ciudad_busqueda && p.ciudad_busqueda.toLowerCase().includes(filter)) ||
                    (p.tipo_busqueda && p.tipo_busqueda.toLowerCase().includes(filter)) ||
                    (p.telefono && p.telefono.toLowerCase().includes(filter)) ||
                    (p.email && p.email.toLowerCase().includes(filter))
                );
            });

            const formatDate = (dateStr) => {
                if (!dateStr) return 'Reciente';
                try {
                    const d = new Date(dateStr);
                    return d.toISOString().split('T')[0];
                } catch (e) {
                    return dateStr.substring(0, 10);
                }
            };

            const gananciaDev = Math.max(0, precioCliente - 200);

            return (
                <div className="min-h-screen flex flex-col font-sans">

                    <header className="glass-nav sticky top-0 z-50 px-6 py-4 flex items-center justify-between">
                        <div className="flex items-center space-x-3 w-1/3">
                            <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex flex-shrink-0 items-center justify-center font-bold text-white shadow-lg shadow-indigo-500/30">
                                AG
                            </div>
                            <div>
                                <h1 className="text-lg font-bold text-white flex items-center gap-2">
                                    Agencia Standalone <span className="text-xs bg-indigo-500/20 text-indigo-400 border border-indigo-500/30 px-2 py-0.5 rounded-full font-mono">Localhost :8000</span>
                                </h1>
                                <p className="text-xs text-gray-400">Motor B2B Prospección & Focus Group IA</p>
                            </div>
                        </div>

                        <div className="flex justify-center w-1/3">
                            <nav className="flex bg-gray-900/80 p-1 rounded-xl border border-gray-800 space-x-1">
                                <button 
                                    onClick={() => setActiveTab('prospector')}
                                    className={`px-4 py-2 text-sm font-semibold rounded-lg transition-all flex items-center gap-2 ${activeTab === 'prospector' ? 'bg-indigo-600 text-white shadow-md' : 'text-gray-400 hover:text-white'}`}>
                                    <i className="fa-solid fa-location-dot text-emerald-400"></i> Prospector Google Maps
                                </button>
                                <button 
                                    onClick={() => setActiveTab('focusgroup')}
                                    className={`px-4 py-2 text-sm font-semibold rounded-lg transition-all flex items-center gap-2 ${activeTab === 'focusgroup' ? 'bg-indigo-600 text-white shadow-md' : 'text-gray-400 hover:text-white'}`}>
                                    <i className="fa-solid fa-comments text-pink-400"></i> Focus Group AI
                                </button>
                                <button 
                                    onClick={() => setActiveTab('campaigns')}
                                    className={`px-4 py-2 text-sm font-semibold rounded-lg transition-all flex items-center gap-2 ${activeTab === 'campaigns' ? 'bg-indigo-600 text-white shadow-md' : 'text-gray-400 hover:text-white'}`}>
                                    <i className="fa-solid fa-bullseye text-amber-400"></i> Campañas & Clientes
                                </button>
                            </nav>
                        </div>

                        <div className="flex items-center justify-end gap-3 w-1/3">
                            <button onClick={async () => {
                                setLoading(true);
                                try {
                                    await fetch('/api/v1/agencia/prospectos_b2b/sincronizar-contactos', { method: 'POST' });
                                } catch(e) {}
                                await fetchProspects();
                                setLoading(false);
                            }} title="Refrescar y Sincronizar Contactos" className="text-xs bg-indigo-700 hover:bg-indigo-600 text-white px-3 py-1.5 rounded-lg border border-indigo-500 transition-all flex items-center gap-1.5 shadow-md">
                                <i className={`fa-solid fa-rotate ${loading ? 'animate-spin' : ''}`}></i> Sincronizar & Actualizar
                            </button>
                            <div className="w-8 h-8 rounded-lg bg-indigo-600/30 border border-indigo-500/40 flex items-center justify-center text-xs font-bold text-indigo-300">
                                DEV
                            </div>
                        </div>
                    </header>

                    <main className="flex-1 p-6 max-w-7xl mx-auto w-full space-y-6">

                        {activeTab === 'prospector' && (
                            <div className="space-y-6">
                                <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                                    <div className="glass-panel p-5 rounded-2xl flex items-center justify-between">
                                        <div>
                                            <p className="text-xs text-gray-400 uppercase font-semibold tracking-wider">Prospectos B2B</p>
                                            <p className="text-2xl font-bold text-white mt-1">{stats.total}</p>
                                        </div>
                                        <div className="w-12 h-12 rounded-xl bg-indigo-500/10 text-indigo-400 flex items-center justify-center text-xl">
                                            <i className="fa-solid fa-users"></i>
                                        </div>
                                    </div>
                                    <div className="glass-panel p-5 rounded-2xl flex items-center justify-between">
                                        <div>
                                            <p className="text-xs text-gray-400 uppercase font-semibold tracking-wider">Sin Sitio Web</p>
                                            <p className="text-2xl font-bold text-amber-400 mt-1">{stats.sin_web}</p>
                                        </div>
                                        <div className="w-12 h-12 rounded-xl bg-amber-500/10 text-amber-400 flex items-center justify-center text-xl">
                                            <i className="fa-solid fa-globe"></i>
                                        </div>
                                    </div>
                                    <div className="glass-panel p-5 rounded-2xl flex items-center justify-between">
                                        <div>
                                            <p className="text-xs text-gray-400 uppercase font-semibold tracking-wider">Enriquecidos (WA/Email)</p>
                                            <p className="text-2xl font-bold text-emerald-400 mt-1">{stats.enriquecidos}</p>
                                        </div>
                                        <div className="w-12 h-12 rounded-xl bg-emerald-500/10 text-emerald-400 flex items-center justify-center text-xl">
                                            <i className="fa-solid fa-circle-check"></i>
                                        </div>
                                    </div>
                                    <div className="glass-panel p-5 rounded-2xl flex items-center justify-between">
                                        <div>
                                            <p className="text-xs text-gray-400 uppercase font-semibold tracking-wider">Contactados</p>
                                            <p className="text-2xl font-bold text-purple-400 mt-1">{stats.contactados}</p>
                                        </div>
                                        <div className="w-12 h-12 rounded-xl bg-purple-500/10 text-purple-400 flex items-center justify-center text-xl">
                                            <i className="fa-solid fa-paper-plane"></i>
                                        </div>
                                    </div>
                                </div>

                                <div className="glass-panel p-6 rounded-2xl border border-gray-800 relative z-30">
                                    <div className="flex gap-3 border-b border-gray-800 pb-3 mb-4">
                                        <button 
                                            type="button"
                                            onClick={() => setSearchMotor('places')}
                                            className={`px-4 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-2 ${searchMotor === 'places' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30' : 'bg-gray-900 text-gray-400 hover:text-white border border-gray-800'}`}>
                                            <i className="fa-solid fa-location-dot text-sky-400"></i> 1. Google Places API (Maps)
                                        </button>
                                        <button 
                                            type="button"
                                            onClick={() => setSearchMotor('reach')}
                                            className={`px-4 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-2 ${searchMotor === 'reach' ? 'bg-gradient-to-tr from-pink-600 to-purple-600 text-white shadow-lg shadow-purple-600/30' : 'bg-gray-900 text-gray-400 hover:text-white border border-gray-800'}`}>
                                            <i className="fa-solid fa-globe text-pink-400"></i> 2. Agent Reach (Social & Web Search)
                                        </button>
                                    </div>

                                    <h2 className="text-lg font-bold text-white mb-4 flex items-center gap-2">
                                        {searchMotor === 'places' ? (
                                            <><i className="fa-solid fa-magnifying-glass-location text-sky-400"></i> Motor de Prospección Multi-Ciudad (Google Places API)</>
                                        ) : (
                                            <><i className="fa-solid fa-network-wired text-pink-500"></i> Escaneo Profundo Multicanal (Facebook, Instagram, LinkedIn, Exa)</>
                                        )}
                                    </h2>
                                     <form onSubmit={handleProspectar} className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                        <div className="relative">
                                            <label className="block text-xs text-gray-400 mb-1 font-semibold">Rubro / Categoría Inteligente</label>
                                            <input 
                                                type="text" 
                                                placeholder="Ej: metalurgica, cafeteria, fletes"
                                                value={searchQuery}
                                                onChange={e => {
                                                    setSearchQuery(e.target.value);
                                                    fetchRubrosSugerencias(e.target.value);
                                                }}
                                                onFocus={() => fetchRubrosSugerencias(searchQuery)}
                                                className="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500"
                                            />
                                            {sugerenciasRubro.length > 0 && (
                                                <div className="absolute z-50 top-full left-0 w-full bg-gray-900 border border-gray-700 rounded-xl mt-1 shadow-2xl overflow-hidden max-h-56 overflow-y-auto border-t-2 border-t-indigo-500">
                                                    {sugerenciasRubro.map((r, idx) => (
                                                        <div 
                                                            key={idx}
                                                            onClick={() => {
                                                                setSearchQuery(r.nombre);
                                                                setSugerenciasRubro([]);
                                                            }}
                                                            className="px-4 py-2.5 text-xs text-gray-200 hover:bg-indigo-600 hover:text-white cursor-pointer transition-colors border-b border-gray-800/80 flex items-center justify-between">
                                                            <span><i className="fa-solid fa-tag text-indigo-400 mr-2"></i>{r.nombre}</span>
                                                            <span className="text-[10px] text-gray-400 font-mono bg-gray-800 px-2 py-0.5 rounded">B2B</span>
                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                        <div className="relative">
                                            <label className="block text-xs text-gray-400 mb-1 font-semibold">Ciudad / Provincia (LATAM)</label>
                                            <input 
                                                type="text" 
                                                placeholder="Ej: Mendoza, Salta, Córdoba, Santiago"
                                                value={searchCity}
                                                onChange={e => {
                                                    setSearchCity(e.target.value);
                                                    fetchUbicacionesSugerencias(e.target.value);
                                                }}
                                                onFocus={() => fetchUbicacionesSugerencias(searchCity)}
                                                className="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500"
                                            />
                                            {sugerenciasUbicacion.length > 0 && (
                                                <div className="absolute z-50 top-full left-0 w-full bg-gray-900 border border-gray-700 rounded-xl mt-1 shadow-2xl overflow-hidden max-h-56 overflow-y-auto border-t-2 border-t-pink-500">
                                                    {sugerenciasUbicacion.map((u, idx) => (
                                                        <div 
                                                            key={idx}
                                                            onClick={() => {
                                                                setSearchCity(`${u.ciudad}, ${u.provincia}`);
                                                                setSugerenciasUbicacion([]);
                                                            }}
                                                            className="px-4 py-2.5 text-xs text-gray-200 hover:bg-pink-600 hover:text-white cursor-pointer transition-colors border-b border-gray-800/80 flex items-center justify-between">
                                                            <span><i className="fa-solid fa-location-dot text-pink-400 mr-2"></i>{u.ciudad}, {u.provincia}</span>
                                                            <span className="text-[10px] text-gray-400 font-mono bg-gray-800 px-2 py-0.5 rounded">{u.pais}</span>
                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                        <div className="flex items-end">
                                            <button 
                                                type="submit" 
                                                disabled={loading}
                                                className={`w-full text-white font-bold py-2.5 px-6 rounded-xl transition-all shadow-lg text-sm flex items-center justify-center gap-2 ${searchMotor === 'places' ? 'bg-indigo-600 hover:bg-indigo-500 shadow-indigo-600/30' : 'bg-gradient-to-tr from-pink-600 to-purple-600 hover:from-pink-500 hover:to-purple-500 shadow-purple-600/30'}`}>
                                                {loading ? <i className="fa-solid fa-spinner fa-spin"></i> : <i className="fa-solid fa-bolt"></i>} 
                                                {searchMotor === 'places' ? 'Iniciar Búsqueda & Deep Scraping' : 'Escanear con Agent Reach'}
                                            </button>
                                        </div>
                                    </form>

                                    {loading && (
                                        <div className="mt-6 pt-4 border-t border-gray-800 animate-fade-in">
                                            <div className="flex justify-between items-center text-xs text-gray-400 mb-2">
                                                <span className="flex items-center gap-2">
                                                    <i className="fa-solid fa-satellite-dish text-pink-400 animate-pulse"></i> 
                                                    Escaneando en vivo empresas reales de {searchQuery || 'rubro'} en {searchCity || 'ubicación'}...
                                                </span>
                                                <span className="font-mono text-pink-400">Procesando fuentes web...</span>
                                            </div>
                                            <div className="w-full bg-gray-900 rounded-full h-2 overflow-hidden border border-gray-800">
                                                <div className="bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 h-full rounded-full animate-pulse w-3/4 transition-all duration-1000"></div>
                                            </div>
                                        </div>
                                    )}
                                </div>

                                <div className="glass-panel rounded-2xl overflow-hidden space-y-4 p-4">
                                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 pb-2 border-b border-gray-800">
                                        <div>
                                            <h3 className="font-bold text-white text-md">Base de Prospectos Capturados</h3>
                                            <p className="text-xs text-gray-400">Mostrando {filteredProspects.length} de {stats.total} empresas en base de datos</p>
                                        </div>

                                        <div className="relative w-full md:w-80">
                                            <i className="fa-solid fa-search absolute left-3.5 top-3 text-xs text-gray-400"></i>
                                            <input 
                                                type="text" 
                                                placeholder="Filtrar por nombre, ciudad, rubro o teléfono..."
                                                value={tableFilter}
                                                onChange={e => setTableFilter(e.target.value)}
                                                className="w-full bg-gray-900 border border-gray-700 rounded-xl pl-9 pr-4 py-2 text-xs text-white focus:outline-none focus:border-indigo-500"
                                            />
                                        </div>
                                    </div>

                                    <div className="overflow-x-auto">
                                        <table className="w-full text-left text-sm text-gray-300">
                                            <thead className="bg-gray-900/60 text-xs uppercase text-gray-400">
                                                <tr>
                                                    <th className="px-4 py-3">Empresa</th>
                                                    <th className="px-4 py-3">Rubro / Categoría</th>
                                                    <th className="px-4 py-3">Ciudad / Ubicación</th>
                                                    <th className="px-4 py-3">Contacto</th>
                                                    <th className="px-4 py-3">Fecha Búsqueda</th>
                                                    <th className="px-4 py-3">Presencia Web</th>
                                                    <th className="px-4 py-3 text-right">Acción</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-gray-800">
                                                {filteredProspects.length === 0 ? (
                                                    <tr>
                                                        <td colSpan="7" className="px-6 py-8 text-center text-gray-500">
                                                            No se encontraron prospectos que coincidan con la búsqueda.
                                                        </td>
                                                    </tr>
                                                ) : (
                                                    filteredProspects.map((p, idx) => (
                                                        <tr key={idx} className="hover:bg-gray-800/40">
                                                            <td className="px-4 py-3 font-semibold text-white">{p.nombre}</td>
                                                            <td className="px-4 py-3 text-indigo-300 font-medium text-xs">
                                                                <span className="inline-block bg-indigo-500/10 text-indigo-300 border border-indigo-500/20 px-2.5 py-1 rounded-lg font-sans whitespace-normal break-words max-w-[200px] leading-tight">
                                                                    {p.tipo_busqueda || 'Servicios'}
                                                                </span>
                                                            </td>
                                                            <td className="px-4 py-3 text-gray-400 text-xs">{p.ciudad_busqueda || 'Rosario, AR'}</td>
                                                            <td className="px-4 py-3">
                                                                {p.telefono || p.whatsapp ? (
                                                                    <span className="text-emerald-400 font-mono text-xs">{p.whatsapp || p.telefono}</span>
                                                                ) : (
                                                                    <span className="text-gray-500 text-xs">Sin teléfono</span>
                                                                )}
                                                            </td>
                                                            <td className="px-4 py-3 text-gray-400 font-mono text-xs whitespace-nowrap">
                                                                {formatDate(p.fecha_creacion || p.created_at)}
                                                            </td>
                                                            <td className="px-4 py-3">
                                                                {p.sitio_web ? (
                                                                    <span className="inline-flex items-center gap-1 bg-blue-500/10 text-blue-400 border border-blue-500/20 text-xs px-2.5 py-1 rounded-full whitespace-nowrap">Con Sitio Web</span>
                                                                ) : (
                                                                    <span className="inline-flex items-center gap-1 bg-amber-500/10 text-amber-400 border border-amber-500/20 text-xs px-2.5 py-1 rounded-full whitespace-nowrap">Sin Sitio Web 🔥</span>
                                                                )}
                                                            </td>
                                                            <td className="px-4 py-3 text-right">
                                                                <button 
                                                                    onClick={() => openDemoConfigModal(p)}
                                                                    className="text-indigo-400 hover:text-indigo-300 font-semibold text-xs bg-indigo-500/10 px-3 py-1.5 rounded-lg border border-indigo-500/20 transition-all flex items-center gap-1.5 ml-auto">
                                                                    <i className="fa-solid fa-wand-magic-sparkles"></i> Generar Demo & Oferta
                                                                </button>
                                                            </td>
                                                        </tr>
                                                    ))
                                                )}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'focusgroup' && (
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                <div className="glass-panel p-6 rounded-2xl space-y-4">
                                    <h3 className="text-md font-bold text-white flex items-center gap-2">
                                        <i className="fa-solid fa-sliders text-indigo-400"></i> Simulación de Audiencia Focus Group
                                    </h3>
                                    <div>
                                        <label className="block text-xs text-gray-400 mb-1">Campaña / Producto</label>
                                        <select className="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-2 text-sm text-white">
                                            <option>Desarrollo Web B2B (Fábrica de Demos)</option>
                                            <option>Gestión de Reservas para Gastronomía</option>
                                            <option>Software de Cotización para Seguros</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-xs text-gray-400 mb-1">Perfil de Avatar IA</label>
                                        <select className="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-2 text-sm text-white">
                                            <option>Dueños de PYME sin presencia digital</option>
                                            <option>Gerentes de Marketing B2B</option>
                                            <option>Clientes finales de Cafeterías Especialidad</option>
                                        </select>
                                    </div>
                                    <div className="p-4 bg-indigo-950/30 border border-indigo-800/40 rounded-xl text-xs text-indigo-300 space-y-2">
                                        <p className="font-semibold"><i className="fa-solid fa-lightbulb"></i> ¿Qué hace la IA de Focus Group?</p>
                                        <p className="text-indigo-300/80">Simula respuestas cualitativas de tu segmento meta evaluando la propuesta de valor, objeciones de precio y sugerencias de copy.</p>
                                    </div>
                                </div>

                                <div className="md:col-span-2 glass-panel rounded-2xl flex flex-col h-[600px]">
                                    <div className="p-4 border-b border-gray-800 flex justify-between items-center">
                                        <h3 className="font-bold text-white flex items-center gap-2">
                                            <i className="fa-solid fa-comments text-pink-500"></i> Sala de Focus Group IA (Simulación en Vivo)
                                        </h3>
                                        <span className="text-xs bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded-full">Gemini / DeepSeek Online</span>
                                    </div>

                                    <div className="flex-1 p-6 overflow-y-auto space-y-4 custom-scrollbar">
                                        {chatMessages.map((msg, i) => (
                                            <div key={i} className={`flex ${msg.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                                                <div className={`max-w-md p-4 rounded-2xl text-sm ${msg.sender === 'user' ? 'bg-indigo-600 text-white rounded-br-none' : 'bg-gray-800 text-gray-200 border border-gray-700 rounded-bl-none'}`}>
                                                    {msg.text}
                                                </div>
                                            </div>
                                        ))}
                                    </div>

                                    <form onSubmit={handleSendFocusGroup} className="p-4 border-t border-gray-800 flex gap-2">
                                        <input 
                                            type="text" 
                                            placeholder="Consulta la opinión de tu audiencia sobre una idea o propuesta..."
                                            value={chatInput}
                                            onChange={e => setChatInput(e.target.value)}
                                            className="flex-1 bg-gray-900 border border-gray-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500"
                                        />
                                        <button 
                                            type="submit"
                                            className="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-2.5 rounded-xl font-bold text-sm shadow-lg shadow-indigo-600/20">
                                            Preguntar
                                        </button>
                                    </form>
                                </div>
                            </div>
                        )}

                        {activeTab === 'campaigns' && (
                            <div className="glass-panel p-8 rounded-2xl text-center space-y-4">
                                <div className="w-16 h-16 bg-amber-500/10 text-amber-400 rounded-2xl flex items-center justify-center mx-auto text-2xl border border-amber-500/20">
                                    <i className="fa-solid fa-bullseye"></i>
                                </div>
                                <h3 className="text-xl font-bold text-white">Módulo de Gestión de Campañas & Clientes B2B</h3>
                                <p className="text-gray-400 text-sm max-w-xl mx-auto">
                                    Este módulo te permite vincular prospectos capturados a clientes activos de la agencia, asignar tareas y supervisar el pipeline de ventas.
                                </p>
                            </div>
                        )}

                    </main>

                    {/* MODAL CONFIGURACIÓN COMERCIAL (DOMINIO + PRECIO + PROMPT) */}
                    {demoPromptModal.open && demoPromptModal.prospect && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
                            <div className="glass-panel p-6 rounded-2xl max-w-xl w-full space-y-5 border border-indigo-500/30 max-h-[90vh] overflow-y-auto custom-scrollbar">
                                <div className="flex justify-between items-center pb-2 border-b border-gray-800">
                                    <div>
                                        <h3 className="text-lg font-bold text-white flex items-center gap-2">
                                            <i className="fa-solid fa-wand-magic-sparkles text-indigo-400"></i> Configurar Oferta Comercial & Landing
                                        </h3>
                                        <p className="text-xs text-gray-400">{demoPromptModal.prospect.nombre}</p>
                                    </div>
                                    <button onClick={() => setDemoPromptModal({ open: false, prospect: null })} className="text-gray-400 hover:text-white">
                                        <i className="fa-solid fa-xmark text-lg"></i>
                                    </button>
                                </div>

                                {/* 1. BUSCADOR DE DOMINIO */}
                                <div className="space-y-2 bg-gray-900/60 p-4 rounded-xl border border-gray-800">
                                    <label className="block text-xs text-gray-300 font-bold flex items-center justify-between">
                                        <span>🌐 Dominio Propuesto para el Cliente</span>
                                        {checkingDomain && <span className="text-[10px] text-indigo-400"><i className="fa-solid fa-spinner fa-spin"></i> Verificando DNS...</span>}
                                    </label>
                                    <input 
                                        type="text" 
                                        value={dominioInput}
                                        onChange={e => setDominioInput(e.target.value)}
                                        placeholder="Ej: miempresa.com"
                                        className="w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-xs text-emerald-400 font-mono focus:outline-none focus:border-indigo-500"
                                    />
                                    {dominiosList.length > 0 && (
                                        <div className="flex flex-wrap gap-1.5 pt-1">
                                            {dominiosList.map((d, i) => (
                                                <button 
                                                    key={i} 
                                                    onClick={() => setDominioInput(d.dominio)}
                                                    className={`text-[10px] px-2 py-0.5 rounded-md font-mono border transition-all ${d.dominio === dominioInput ? 'bg-indigo-600 text-white border-indigo-500' : (d.disponible ? 'bg-emerald-500/10 text-emerald-300 border-emerald-500/30' : 'bg-gray-800 text-gray-400 border-gray-700')}`}>
                                                    {d.dominio} {d.disponible ? '✓ Disponible' : '× Ocupado'}
                                                </button>
                                            ))}
                                        </div>
                                    )}
                                </div>

                                {/* 2. CONFIGURADOR DE PRECIOS Y GANANCIA DEV */}
                                <div className="space-y-3 bg-indigo-950/30 p-4 rounded-xl border border-indigo-800/40">
                                    <div className="flex justify-between items-center">
                                        <label className="text-xs text-indigo-200 font-bold">💵 Precio a Cobrar al Cliente ($ USD)</label>
                                        <span className="text-xs font-mono font-extrabold text-white bg-indigo-600 px-2.5 py-1 rounded-lg">${precioCliente} USD</span>
                                    </div>
                                    <input 
                                        type="range" 
                                        min="200" 
                                        max="1000" 
                                        step="25"
                                        value={precioCliente}
                                        onChange={e => setPrecioCliente(Number(e.target.value))}
                                        className="w-full accent-indigo-500"
                                    />
                                    <div className="grid grid-cols-3 gap-2 text-center text-xs pt-1">
                                        <div className="bg-gray-900/80 p-2 rounded-lg border border-gray-800">
                                            <p className="text-[10px] text-gray-400">Precio Cliente</p>
                                            <p className="font-bold text-white">${precioCliente} USD</p>
                                        </div>
                                        <div className="bg-gray-900/80 p-2 rounded-lg border border-gray-800">
                                            <p className="text-[10px] text-gray-400">Infraestructura</p>
                                            <p className="font-bold text-amber-400">-$200 USD</p>
                                        </div>
                                        <div className="bg-emerald-950/50 p-2 rounded-lg border border-emerald-800/60">
                                            <p className="text-[10px] text-emerald-400 font-bold">Tu Ganancia Dev</p>
                                            <p className="font-extrabold text-emerald-300">+${gananciaDev} USD</p>
                                        </div>
                                    </div>
                                </div>

                                {/* 3. PROMPT PERSONALIZADO */}
                                <div className="space-y-2">
                                    <label className="block text-xs text-gray-400 font-semibold">Directivas / Prompt Personalizado para IA (Opcional):</label>
                                    <textarea 
                                        rows="2"
                                        placeholder="Ej: Enfocar en elegancia y alta gama, destacar atención 24hs, servicio a domicilio y garantía de satisfacción..."
                                        value={customPromptText}
                                        onChange={e => setCustomPromptText(e.target.value)}
                                        className="w-full bg-gray-900 border border-gray-700 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-indigo-500"
                                    ></textarea>
                                </div>

                                <div className="flex gap-2 pt-2">
                                    <button 
                                        onClick={() => triggerGenerarDemo(customPromptText)}
                                        className="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 rounded-xl text-center text-xs shadow-lg shadow-indigo-600/20 transition-all flex items-center justify-center gap-2">
                                        <i className="fa-solid fa-wand-magic-sparkles"></i> Generar Landing & Checkout (${precioCliente} USD)
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL RESULTADO DE DEMO & CHECKOUT */}
                    {demoResultModal.open && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
                            <div className="glass-panel p-6 rounded-2xl max-w-lg w-full space-y-4 border border-indigo-500/30">
                                <div className="flex justify-between items-center">
                                    <h3 className="text-lg font-bold text-white flex items-center gap-2">
                                        <i className="fa-solid fa-wand-magic-sparkles text-indigo-400"></i> Demo & Oferta Lista
                                    </h3>
                                    <button onClick={() => setDemoResultModal({ open: false, data: null, loading: false })} className="text-gray-400 hover:text-white">
                                        <i className="fa-solid fa-xmark text-lg"></i>
                                    </button>
                                </div>

                                {demoResultModal.loading ? (
                                    <div className="py-12 text-center space-y-3">
                                        <i className="fa-solid fa-spinner fa-spin text-3xl text-indigo-400"></i>
                                        <p className="text-sm text-gray-300 font-semibold">Generando copy, maquetación glassmorphic 10/10 y checkout dLocal GO...</p>
                                    </div>
                                ) : demoResultModal.data ? (
                                    <div className="space-y-4">
                                        <div className="p-4 bg-gray-900 rounded-xl border border-gray-800 space-y-2 text-xs">
                                            <p className="text-gray-400">Negocio: <strong className="text-white">{demoResultModal.data.nombre}</strong></p>
                                            <p className="text-gray-400">Precio Comercial: <strong className="text-emerald-400 font-mono">${demoResultModal.data.precio_usd} USD</strong></p>
                                            {demoResultModal.data.dominio_elegido && <p className="text-gray-400">Dominio Elegido: <span className="text-indigo-400 font-mono">{demoResultModal.data.dominio_elegido}</span></p>}
                                            <p className="text-gray-400">URL Demo: <a href={demoResultModal.data.url_demo} target="_blank" className="text-indigo-400 underline font-mono">{demoResultModal.data.url_demo}</a></p>
                                        </div>

                                        {dlocalLink && (
                                            <div className="p-3 bg-emerald-950/40 border border-emerald-800/60 rounded-xl text-xs space-y-1">
                                                <p className="font-bold text-emerald-300 flex items-center gap-1.5">
                                                    <i className="fa-solid fa-shield-halved"></i> Checkout dLocal GO (CATSOF S.A.S.):
                                                </p>
                                                <p className="font-mono text-emerald-400 break-all select-all text-[11px]">{dlocalLink}</p>
                                            </div>
                                        )}

                                        <div className="flex flex-col gap-2">
                                            <a 
                                                href={demoResultModal.data.url_demo} 
                                                target="_blank" 
                                                className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 rounded-xl text-center text-sm shadow-lg shadow-indigo-600/20 transition-all flex items-center justify-center gap-2">
                                                <i className="fa-solid fa-arrow-up-right-from-square"></i> Ver Demo Glassmorphic 10/10 ↗
                                            </a>
                                            {demoResultModal.data.link_wa ? (
                                                <a 
                                                    href={demoResultModal.data.link_wa} 
                                                    target="_blank" 
                                                    className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-xl text-center text-sm shadow-lg shadow-emerald-600/20 transition-all flex items-center justify-center gap-2">
                                                    <i className="fa-brands fa-whatsapp"></i> Enviar Propuesta por WhatsApp 📲
                                                </a>
                                            ) : (
                                                <p className="text-xs text-center text-amber-400 font-mono">Sin teléfono para WhatsApp directo</p>
                                            )}
                                        </div>
                                    </div>
                                ) : null}
                            </div>
                        </div>
                    )}

                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
